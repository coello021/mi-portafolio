<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red de Sucursales Vidrí — Mapa en vivo</title>
<meta name="description" content="Rutas de distribución desde CD Nejapa, cierres viales y tráfico en tiempo real.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#EEE8DA; --panel:#F7F2E6; --fg:#26241F; --muted:#6d685c; --line:#d9d1bd;
  --rojo:#E0262B; --naranja:#DE7A2C; --azul:#3A76B0;
  --libre:#6E8B6A; --prec:#DE7A2C; --afect:#C7453A;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d1b17; --panel:#26241F; --fg:#EEE8DA; --muted:#a8a190; --line:#3d3a32; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:400px 1fr;height:100vh;height:100dvh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:21px}
header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
#aviso{margin:10px 16px 0;padding:8px 10px;border-left:3px solid var(--naranja);background:rgba(222,122,44,.12);font-size:12.5px;display:none}
#aviso.ok{border-color:var(--libre);background:rgba(110,139,106,.14)}
.tabs{display:flex;gap:4px;padding:10px 16px 0}
.tab{border:1px solid var(--line);background:transparent;padding:5px 12px;border-radius:999px;font-size:13px}
.tab[aria-selected=true]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.cuerpo{flex:1;overflow:auto;padding:10px 16px 16px;min-height:0}
input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed=true]{background:var(--azul);border-color:var(--azul);color:#fff}
.capas{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:8px 0 12px;font-size:13px}
.capas label{display:flex;gap:6px;align-items:center}
.capas label.off{opacity:.45}
.item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:9px 2px}
.item:hover{background:rgba(0,0,0,.04)}
.punto{width:11px;height:11px;border-radius:50%;flex:none}
.item b{display:block;font-weight:500}
.item small{color:var(--muted)}
.item .t{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;color:#fff}
.vacio{color:var(--muted);padding:14px 0}
.atras{border:0;background:transparent;color:var(--azul);padding:0;margin-bottom:8px}
.det h2{font-size:22px}
.det .meta{color:var(--muted);margin:2px 0 10px}
.caja{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--bg)}
.caja h3{font-size:15px;margin-bottom:4px}
.grande{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12.5px}
ol.pasos{margin:6px 0 0;padding:0;list-style:none}
ol.pasos li{padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
ol.pasos li:hover{background:rgba(0,0,0,.04)}
ol.pasos .al{color:var(--afect);font-size:12.5px}
a.btn{display:inline-block;margin-top:6px;background:var(--rojo);color:#fff;text-decoration:none;padding:7px 14px;border-radius:8px;font-weight:500}
#mapa{height:100%;min-height:0;background:#ddd}
.cd-icon{width:18px;height:18px;background:var(--rojo);border:3px solid #fff;box-shadow:0 0 0 2px var(--rojo);transform:rotate(45deg)}
.leaflet-popup-content{font:13px/1.4 "IBM Plex Sans",sans-serif;margin:10px 12px}
.leaflet-popup-content b{font-family:Newsreader,serif;font-size:15px}
.leyenda{background:var(--panel);color:var(--fg);padding:8px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:1.7}
.leyenda i{display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.venc{opacity:.7}

.stats{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin:12px 0 4px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat .n{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:11.5px;color:var(--muted);line-height:1.3}
.stat.prec .n{color:var(--prec)} .stat.afect .n{color:var(--afect)} .stat.ok .n{color:var(--libre)}
.via{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 0}
.via span{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.alerta{border-left:4px solid var(--afect);background:rgba(199,69,58,.1);border-radius:6px;padding:8px 10px;margin:10px 0}
.alerta.prec{border-color:var(--prec);background:rgba(222,122,44,.12)}
.alerta b{display:block}
.okline{color:var(--libre);margin:10px 0 0;font-weight:500}
.dato{font-size:13px;margin:2px 0;color:var(--muted)}
.dato a{color:inherit}
details.pasos-d{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--bg)}
details.pasos-d summary{cursor:pointer;padding:10px 12px;font-weight:500}
details.pasos-d ol.pasos{padding:0 12px 8px}

.leyenda hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.leyenda .lg{display:inline-block;vertical-align:middle;margin-right:8px;flex:none}
.leyenda .lg-cd{width:9px;height:9px;background:var(--rojo);transform:rotate(45deg);border:1.5px solid #fff;box-shadow:0 0 0 1px var(--rojo);margin:0 9px 0 6px}
.leyenda .lg-suc{width:11px;height:11px;border-radius:50%;background:#777;border:2px solid #fff;box-shadow:0 0 0 1px #777;margin:0 7px 0 5px}
.leyenda .lg-cie{width:18px;height:18px;border-radius:50%;border:2px solid var(--afect);background:rgba(199,69,58,.22);margin-right:5px}
.leyenda .lg-venc{border-style:dashed;opacity:.65}
.leyenda .lg-traf{width:30px;height:5px;border-radius:3px;background:linear-gradient(90deg,#2e9f4a,#f2c200,#e8742c,#c0261b,#6e0c0c);margin-right:5px}
#sello{margin:6px 16px 0;font-size:12px;color:var(--muted)}
#sello.viejo{color:var(--fg);border-left:3px solid var(--naranja);background:rgba(222,122,44,.12);padding:6px 9px;font-size:12.5px}
.btn-sec{border:1px solid var(--fg);background:transparent;border-radius:8px;padding:7px 12px;font-weight:500;margin-bottom:10px;width:100%}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:16px 18px;width:min(560px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;margin:10px 0 2px;font-weight:500}
dialog input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.dlg-acc{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dlg-acc button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 14px}
.dlg-acc button.pri{background:var(--rojo);border-color:var(--rojo);color:#fff}
.dlg-acc button:disabled{opacity:.4;cursor:not-allowed}
.err{border-left:4px solid var(--afect);background:rgba(199,69,58,.1);padding:8px 10px;margin:10px 0;border-radius:6px}
.adv{border-left:4px solid var(--prec);background:rgba(222,122,44,.12);padding:8px 10px;margin:8px 0;border-radius:6px}
.res ul{margin:4px 0 8px;padding-left:18px}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:48vh 1fr}
  #mapa{order:-1}
  #side{border-right:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>Red de sucursales Vidrí</h1>
      <p>Rutas desde CD Nejapa · cierres viales · tráfico en vivo</p>
    </header>
    <div id="aviso" role="status"></div>
    <div id="sello"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-suc" aria-selected="true">Sucursales</button>
      <button class="tab" role="tab" id="tab-cie" aria-selected="false">Cierres</button>
    </div>
    <div class="cuerpo" id="cuerpo"></div>
  </aside>
  <main id="mapa" aria-label="Mapa"></main>
</div>

<dialog id="dlg" aria-labelledby="dlg-t">
  <h2 id="dlg-t" style="font-size:20px">Actualizar cierres</h2>
  <p class="sub">Sube el reporte JSON. Solo se acepta si es más nuevo que lo publicado; nunca retrocede.</p>
  <label for="dlg-pin">PIN</label><input type="password" id="dlg-pin" autocomplete="off">
  <label for="dlg-file">Archivo del reporte (.json)</label><input type="file" id="dlg-file" accept=".json,application/json">
  <div id="dlg-res" class="res" aria-live="polite"></div>
  <div class="dlg-acc"><button id="dlg-cancel" type="button">Cancelar</button><button id="dlg-rev" type="button" disabled>Revisar</button><button id="dlg-ok" type="button" class="pri" disabled>Aplicar cambios</button></div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
const COLOR = {'Libre':'#6E8B6A','Precaución':'#DE7A2C','Afectada':'#C7453A'};
const $ = (s)=>document.querySelector(s);
const esc = (t)=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = (t)=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const HOY = new Date().toISOString().slice(0,10);

const S = { suc:[], cd:null, rutas:new Map(), cierres:[], sel:null, zona:'Todas', estado:'Todos', q:'',
  capas:{rutas:true,cierres:true,flujo:true,incidentes:false}, trafico:false, tab:'suc', eta:new Map() };

// ---------- utilidades ----------
function decodePoly(str){
  let i=0,lat=0,lon=0,out=[];
  while(i<str.length){
    let b,sh=0,r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);
    lat+=(r&1)?~(r>>1):(r>>1);
    sh=0;r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);
    lon+=(r&1)?~(r>>1):(r>>1);
    out.push([lat/1e5,lon/1e5]);
  }
  return out;
}
const fmtMin = (m)=> m>=60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`;
const fmtM = (m)=> m>=1000 ? `${(m/1000).toFixed(1)} km` : `${m} m`;
function vigencia(c){
  if(!c.vigente_hasta) return {txt:'Sin fecha de fin publicada', vencido:false};
  const v = c.vigente_hasta < HOY;
  return {txt: (v?'Venció el ':'Vigente hasta el ')+c.vigente_hasta, vencido:v};
}
async function getJSON(u){ const r=await fetch(u); if(!r.ok) throw new Error(u+' '+r.status); return r.json(); }

// ---------- mapa ----------
const map = L.map('mapa',{zoomControl:true}).setView([13.75,-89.2],9);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const gRutas=L.layerGroup().addTo(map), gSuc=L.layerGroup().addTo(map), gCie=L.layerGroup().addTo(map);
let capaFlujo=null, capaInc=null, errTeselas=0;

function bucket(){ return Math.floor(Date.now()/300000); } // 5 min, igual para todos => cachea el CDN
function crearCapaTrafico(nombre, opacidad){
  const l = L.tileLayer(`/api/tiles/${nombre}/{z}/{x}/{y}?t=${bucket()}`,{opacity:opacidad,minZoom:6,maxZoom:19,maxNativeZoom:16,zIndex:300});
  l.on('tileerror',()=>{ if(++errTeselas===8) avisar('Tráfico en vivo no disponible por ahora (límite diario o servicio caído). Se muestran tiempos estimados.', false); });
  return l;
}
function refrescarTrafico(){
  if(!S.trafico) return;
  errTeselas=0;
  for(const [l,n] of [[capaFlujo,'flujo'],[capaInc,'incidentes']]) if(l) l.setUrl(`/api/tiles/${n}/{z}/{x}/{y}?t=${bucket()}`);
  const h=new Date().toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit'});
  avisar(`Tráfico en vivo activo · actualizado ${h} (se refresca cada 5 min)`, true);
}
function aplicarCapaTrafico(){
  if(!S.trafico) return;
  if(S.capas.flujo){ capaFlujo = capaFlujo||crearCapaTrafico('flujo',.85); capaFlujo.addTo(map);} else if(capaFlujo) map.removeLayer(capaFlujo);
  if(S.capas.incidentes){ capaInc = capaInc||crearCapaTrafico('incidentes',1); capaInc.addTo(map);} else if(capaInc) map.removeLayer(capaInc);
}
function avisar(txt, ok){ const a=$('#aviso'); a.textContent=txt; a.className=ok?'ok':''; a.style.display='block'; }

let leyendaEl=null;
function htmlLeyenda(){
  return `<div><i style="background:${COLOR.Libre}"></i>Ruta libre</div><div><i style="background:${COLOR['Precaución']}"></i>Ruta con precaución</div><div><i style="background:${COLOR.Afectada}"></i>Ruta afectada</div><hr>
  <div><span class="lg lg-cd"></span>CD Nejapa (salida)</div>
  <div><span class="lg lg-suc"></span>Sucursal (color = estado)</div>
  <div><span class="lg lg-cie"></span>Zona de cierre vial</div>
  <div><span class="lg lg-cie lg-venc"></span>Cierre vencido</div>
  ${S.trafico?'<hr><div><span class="lg lg-traf"></span>Tráfico: fluido → detenido</div>':''}`;
}
const Leyenda = L.control({position:'bottomright'});
Leyenda.onAdd=()=>{ leyendaEl=L.DomUtil.create('div','leyenda'); leyendaEl.innerHTML=htmlLeyenda(); return leyendaEl; };
Leyenda.addTo(map);

// ---------- datos derivados ----------
function visibles(){
  const q=norm(S.q);
  return S.suc.filter(s=>{
    if(S.zona!=='Todas' && s.zona!==S.zona) return false;
    const r=S.rutas.get(s.codigo);
    if(S.estado!=='Todos' && (!r || r.estado!==S.estado)) return false;
    if(q && !norm(`${s.sucursal} ${s.municipio} ${s.departamento} ${s.codigo} ${s.direccion}`).includes(q)) return false;
    return true;
  });
}

// ---------- dibujo del mapa ----------
const refs = { marcadores:new Map(), lineas:new Map() };
function dibujarMapa(){
  gRutas.clearLayers(); gSuc.clearLayers(); gCie.clearLayers();
  refs.marcadores.clear(); refs.lineas.clear();
  const vis = visibles();

  // CD
  L.marker([S.cd.lat,S.cd.lon],{icon:L.divIcon({className:'',html:'<div class="cd-icon"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000})
    .bindPopup(`<b>${esc(S.cd.sucursal)}</b><br>Punto de salida de todas las rutas`).addTo(gSuc);

  for(const s of vis){
    const r=S.rutas.get(s.codigo);
    const col = r?COLOR[r.estado]:'#777';
    const esSel = S.sel===s.codigo;
    if(r && r.poly && S.capas.rutas){
      const l=L.polyline(decodePoly(r.poly),{color:col,weight:esSel?6:3,opacity:S.sel?(esSel?.95:.22):.6,lineJoin:'round'})
        .on('click',()=>seleccionar(s.codigo)).addTo(gRutas);
      l.bindTooltip(`${esc(s.sucursal)} · ${esc(r.estado)}`,{sticky:true});
      refs.lineas.set(s.codigo,l);
    }
    const m=L.circleMarker([s.lat,s.lon],{radius:esSel?9:7,color:'#fff',weight:2,fillColor:col,fillOpacity:1})
      .on('click',()=>seleccionar(s.codigo)).addTo(gSuc);
    m.bindTooltip(esc(s.sucursal),{direction:'top'});
    refs.marcadores.set(s.codigo,m);
  }
  if(S.sel && refs.lineas.has(S.sel)) refs.lineas.get(S.sel).bringToFront();

  if(S.capas.cierres){
    for(const c of S.cierres){
      const v=vigencia(c), col=COLOR[c.estado]||COLOR.Afectada;
      L.circle([c.lat,c.lon],{radius:c.radio_m,color:col,weight:2,fillColor:col,fillOpacity:v.vencido?.05:.2,dashArray:v.vencido?'6 6':null})
        .bindPopup(popupCierre(c)).addTo(gCie);
      L.circleMarker([c.lat,c.lon],{radius:5,color:'#fff',weight:1.5,fillColor:col,fillOpacity:1}).bindPopup(popupCierre(c)).addTo(gCie);
    }
  }
}
function popupCierre(c){
  const v=vigencia(c);
  return `<b>${esc(c.nombre)}</b><br><span class="pill" style="background:${COLOR[c.estado]||COLOR.Afectada}">${esc(c.estado)}</span> ${esc(c.tipo)}
  <p style="margin:6px 0">${esc(c.detalle)}</p><p style="margin:6px 0"><b style="font-size:13px">Recomendación:</b> ${esc(c.recomendacion)}</p>
  <div class="sub ${v.vencido?'venc':''}">${esc(v.txt)}<br>Fuente: ${esc(c.fuente)}</div>`;
}
function ajustarVista(){
  const pts=visibles().map(s=>[s.lat,s.lon]); pts.push([S.cd.lat,S.cd.lon]);
  map.fitBounds(pts,{padding:[40,40],maxZoom:13});
}

// ---------- panel ----------
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.id==='tab-'+S.tab));
  if(S.sel) return renderDetalle();
  S.tab==='suc' ? renderLista() : renderCierres();
}
function renderLista(){
  const zonas=['Todas',...new Set(S.suc.filter(s=>s.codigo!=='CD').map(s=>s.zona))];
  const estados=['Todos','Libre','Precaución','Afectada'];
  const vis=visibles();
  const cap=(id,txt,dis)=>`<label class="${dis?'off':''}"><input type="checkbox" data-capa="${id}" ${S.capas[id]?'checked':''} ${dis?'disabled':''}> ${txt}</label>`;
  $('#cuerpo').innerHTML=`
    <input type="search" id="q" placeholder="Buscar sucursal, municipio o código…" value="${esc(S.q)}" aria-label="Buscar sucursal">
    <div class="chips" aria-label="Zona">${zonas.map(z=>`<button class="chip" data-zona="${esc(z)}" aria-pressed="${S.zona===z}">${esc(z)}</button>`).join('')}</div>
    <div class="chips" aria-label="Estado de ruta">${estados.map(e=>`<button class="chip" data-estado="${e}" aria-pressed="${S.estado===e}">${e}</button>`).join('')}</div>
    <div class="capas">
      ${cap('rutas','Rutas')}${cap('cierres','Cierres')}
      ${cap('flujo','Tráfico en vivo',!S.trafico)}${cap('incidentes','Incidentes',!S.trafico)}
    </div>
    <div class="sub" style="margin-bottom:4px">${vis.length} sucursal${vis.length===1?'':'es'}</div>
    ${vis.length? vis.map(s=>{const r=S.rutas.get(s.codigo);return `
      <button class="item" data-cod="${esc(s.codigo)}">
        <span class="punto" style="background:${r?COLOR[r.estado]:'#777'}"></span>
        <span><b>${esc(s.sucursal)}</b><small>${esc(s.municipio)} · ${esc(s.zona)}</small></span>
        <span class="t">${r?`${r.km} km<br><small>${fmtMin(r.minutos)}</small>`:''}</span>
      </button>`}).join('') : '<div class="vacio">Ninguna sucursal coincide con el filtro.</div>'}`;
  const q=$('#q'); q.addEventListener('input',()=>{S.q=q.value;dibujarMapa();renderListaSoloItems();});
}
// actualiza lista sin perder el foco del buscador
function renderListaSoloItems(){ const f=$('#q'); const pos=f.selectionStart; renderLista(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); }
function renderCierres(){
  $('#cuerpo').innerHTML = `<button class="btn-sec" id="btn-actualizar">Actualizar cierres (subir reporte)…</button><p class="sub">VMT, MOP y FOVIAL no publican una API: los cierres vienen del último reporte subido. Revisa siempre la fecha de vigencia.</p>` +
    S.cierres.map(c=>{const v=vigencia(c);return `
    <div class="caja ${v.vencido?'venc':''}" data-cie="${esc(c.id)}" style="cursor:pointer">
      <h3>${esc(c.nombre)}</h3>
      <span class="pill" style="background:${COLOR[c.estado]||COLOR.Afectada}">${esc(c.estado)}</span> <span class="sub">${esc(c.tipo)}</span>
      <p style="margin:6px 0">${esc(c.detalle)}</p>
      <div class="sub"><b>${esc(v.txt)}</b> · ${esc(c.fuente)}</div>
    </div>`}).join('');
}
function statsHTML(r, d, modo){
  let ahora, a1, clase='';
  if(modo==='vivo'){
    ahora='≈ '+fmtMin(d.min_ajustado ?? d.min_vivo);
    a1='estimado'+(d.modo==='camion'?' para camión':'')+(d.retraso_min>0?` · +${d.retraso_min} min por tráfico`:'');
    clase=d.retraso_min>=10?'afect':d.retraso_min>=3?'prec':'';
  } else if(modo==='carga'){
    ahora='…'; a1='consultando tráfico en vivo';
  } else {
    ahora=fmtMin(r.minutos); a1=modo==='fallo'?'estimado fijo · sin datos en vivo':'estimado fijo';
  }
  return `<div class="stat ${clase}"><div class="n">${ahora}</div><div class="l">${a1}</div></div>
    <div class="stat"><div class="n">${r.km} km</div><div class="l">distancia</div></div>`;
}
function renderDetalle(){
  const s=S.suc.find(x=>x.codigo===S.sel), r=S.rutas.get(s.codigo);
  let pasos=[]; try{ pasos=JSON.parse(r.pasos||'[]'); }catch{}
  const via=(r.via||'').split(/\s*(?:→|->)\s*/).filter(Boolean);
  const af=(r.afectacion||'').trim();
  const sinAf=!af||/^sin cierres/i.test(af);
  const bloqueAf = sinAf
    ? `<div class="okline">✓ ${esc(af||'Sin cierres viales reportados en la ruta')}</div>${r.recomendacion?`<div class="sub">${esc(r.recomendacion)}</div>`:''}`
    : `<div class="alerta ${r.estado==='Precaución'?'prec':''}"><b>${esc(r.estado==='Afectada'?'Ruta afectada':'Precaución en la ruta')}</b>${esc(af)}${r.recomendacion?`<div style="margin-top:4px"><b style="display:inline">Qué hacer:</b> ${esc(r.recomendacion)}</div>`:''}</div>`;
  $('#cuerpo').innerHTML=`<div class="det">
    <button class="atras" id="atras">← Todas las sucursales</button>
    <h2>${esc(s.sucursal)}</h2>
    <div class="meta"><span class="pill" style="background:${COLOR[r.estado]}">${esc(r.estado)}</span> ${esc(s.tipo)} ${esc(s.codigo)} · ${esc(s.municipio)}</div>
    <div class="stats" id="stats">${statsHTML(r,null,S.trafico?'carga':'fijo')}</div>
    <div class="sub" id="eta-nota">${esc('Horas pico: mañana '+fmtMin(r.min_trafico_am)+' · tarde '+fmtMin(r.min_trafico_pm))}</div>
    ${via.length?`<div class="via" aria-label="Vías">${via.map(v=>`<span>${esc(v)}</span>`).join('')}</div>`:''}
    ${bloqueAf}
    <details class="pasos-d"><summary>Indicaciones paso a paso (${pasos.length})</summary>
      <ol class="pasos">${pasos.map((p,i)=>`<li data-i="${i}"><b>${esc(p[0])}</b>${p[1]?` — ${esc(p[1])}`:''} <span class="sub">· ${fmtM(p[2])}</span>${p[5]?`<div class="al">⚠ ${esc(p[5])}</div>`:''}</li>`).join('')}</ol>
    </details>
    <div class="dato">📍 ${esc(s.direccion)}</div>
    ${s.telefono?`<div class="dato">📞 <a href="tel:${esc(s.telefono)}">${esc(s.telefono)}</a></div>`:''}
    <div class="dato">🕒 ${esc(s.horario_semana)} · Dom ${esc(s.horario_domingo)}</div>
  </div>`;
  $('#atras').onclick=()=>seleccionar(null);
  document.querySelectorAll('ol.pasos li').forEach(li=>li.onclick=()=>{const p=pasos[li.dataset.i]; map.flyTo([p[4],p[3]],16,{duration:.8});});
  if(S.trafico) cargarEta(s.codigo, r);
}
async function cargarEta(codigo, r){
  const hit=S.eta.get(codigo);
  let d=null;
  if(hit && Date.now()-hit.t<300000) d=hit.d;
  else try{ d=await getJSON('/api/eta?codigo='+encodeURIComponent(codigo)); S.eta.set(codigo,{t:Date.now(),d}); }catch{}
  const st=$('#stats'); if(!st || S.sel!==codigo) return;
  if(!d){ st.innerHTML=statsHTML(r,null,'fallo'); return; }
  st.innerHTML=statsHTML(r,d,'vivo');
  const h=new Date(d.actualizado).toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit'});
  const base=`TomTom (${d.modo==='camion'?'camión':'carro'}): ${fmtMin(d.min_vivo)}`+(d.margen_pct>0?` + ${d.margen_pct} % por semáforos, paradas y maniobras`:'');
  $('#eta-nota').innerHTML=esc(`Estimado, no exacto. ${base} (${h}). La ruta de TomTom puede diferir de la dibujada.`)+(d.modo==='carro'?'<br>'+esc('TomTom no tuvo perfil de camión para esta ruta: se calculó como carro.'):'')+'<br>'+esc('Horas pico: mañana '+fmtMin(r.min_trafico_am)+' · tarde '+fmtMin(r.min_trafico_pm));
}

// ---------- interacción ----------
function seleccionar(cod){
  S.sel=cod;
  dibujarMapa();
  if(cod){
    const l=refs.lineas.get(cod);
    if(l) map.fitBounds(l.getBounds(),{padding:[50,50]});
    else { const s=S.suc.find(x=>x.codigo===cod); map.flyTo([s.lat,s.lon],14); }
  } else ajustarVista();
  render();
  $('#cuerpo').scrollTop=0;
}
$('#tab-suc').onclick=()=>{S.tab='suc';S.sel=null;dibujarMapa();render();};
$('#tab-cie').onclick=()=>{S.tab='cie';S.sel=null;dibujarMapa();render();};
$('#cuerpo').addEventListener('click',e=>{
  if(e.target.closest('#btn-actualizar')) return abrirDlg();
  const z=e.target.closest('[data-zona]'), es=e.target.closest('[data-estado]'), it=e.target.closest('[data-cod]'), ci=e.target.closest('[data-cie]');
  if(z){S.zona=z.dataset.zona;dibujarMapa();ajustarVista();render();}
  else if(es){S.estado=es.dataset.estado;dibujarMapa();ajustarVista();render();}
  else if(it) seleccionar(it.dataset.cod);
  else if(ci){const c=S.cierres.find(x=>x.id===ci.dataset.cie);map.flyTo([c.lat,c.lon],15,{duration:.8});
    L.popup().setLatLng([c.lat,c.lon]).setContent(popupCierre(c)).openOn(map);}
});
$('#cuerpo').addEventListener('change',e=>{
  const id=e.target.dataset.capa; if(!id) return;
  S.capas[id]=e.target.checked;
  if(id==='flujo'||id==='incidentes') aplicarCapaTrafico(); else dibujarMapa();
});

// ---------- datos ----------
async function cargarDatos(){
  try{
    const [suc,rutas,cierres,meta]=await Promise.all([getJSON('data/sucursales.json'),getJSON('data/rutas.json'),getJSON('data/cierres.json'),getJSON('data/meta.json').catch(()=>null)]);
    S.cd=suc.find(s=>s.codigo==='CD'); S.suc=suc.filter(s=>s.codigo!=='CD');
    S.rutas.clear(); rutas.forEach(r=>S.rutas.set(String(r.codigo),r)); S.cierres=cierres; S.meta=meta;
  }catch(e){ return false; }
  try{ // último reporte subido (si existe) sobre los datos base
    const a=await getJSON('/api/cierres');
    if(a && a.origen==='subido'){
      S.cierres=a.cierres;
      for(const [cod,o] of Object.entries(a.rutas||{})){ const r=S.rutas.get(cod); if(r) Object.assign(r,o); }
      S.meta={corte:a.corte,corte_iso:a.corte_iso,subido:a.subido,origen:'subido'};
    }
  }catch(e){}
  pintarSello();
  return true;
}
function pintarSello(){
  const m=S.meta, el=$('#sello'); if(!m||!m.corte_iso){ el.textContent=''; return; }
  const c=new Date(m.corte_iso), h=(Date.now()-c)/36e5;
  const f=c.toLocaleString('es-SV',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  if(h>48){ el.className='viejo'; el.textContent=`⚠ Cierres sin actualizar desde hace ${Math.floor(h/24)} días (corte: ${f}). Confirma antes de despachar.`; }
  else { el.className=''; el.textContent=`Cierres y rutas: corte del ${f}${m.origen==='subido'?'':' (datos base)'}`; }
}

// ---------- subir reporte ----------
let reporte=null;
const dlg=$('#dlg');
function abrirDlg(){ reporte=null; $('#dlg-res').innerHTML=''; $('#dlg-file').value=''; $('#dlg-rev').disabled=true; $('#dlg-ok').disabled=true; dlg.showModal(); }
$('#dlg-cancel').onclick=()=>{ $('#dlg-pin').value=''; dlg.close(); };
$('#dlg-file').onchange=async e=>{
  reporte=null; $('#dlg-ok').disabled=true; $('#dlg-rev').disabled=true;
  const f=e.target.files[0]; if(!f) return;
  try{ reporte=JSON.parse(await f.text()); $('#dlg-rev').disabled=false; $('#dlg-res').innerHTML=`<div class="sub">Archivo listo: ${esc(f.name)}. Pulsa “Revisar”.</div>`; }
  catch{ $('#dlg-res').innerHTML='<div class="err">El archivo no es un JSON válido.</div>'; }
};
async function enviar(modo){
  const r=await fetch('/api/cierres/subir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('#dlg-pin').value,reporte,modo})});
  let d={}; try{ d=await r.json(); }catch{} return {status:r.status,d};
}
const lista=(t,a)=>a.length?`<b>${t}</b><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
$('#dlg-rev').onclick=async()=>{
  $('#dlg-ok').disabled=true; $('#dlg-res').innerHTML='<div class="sub">Revisando…</div>';
  let r; try{ r=await enviar('previa'); }catch{ $('#dlg-res').innerHTML='<div class="err">No se pudo contactar al servidor.</div>'; return; }
  const {status,d}=r;
  if(status!==200){ $('#dlg-res').innerHTML=`<div class="err"><b>${esc(d.error||'Error '+status)}</b>${d.detalles?`<ul>${d.detalles.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`; return; }
  const c=d.diferencias.cierres, rt=d.diferencias.rutas;
  $('#dlg-res').innerHTML=`<div><b>Corte nuevo:</b> ${esc(d.corte_nuevo)}<br><b>Corte publicado:</b> ${esc(d.corte_actual)}</div>
    ${d.diferencias.advertencias.map(a=>`<div class="adv">⚠ ${esc(a)}</div>`).join('')}
    <p>Cierres: ${c.total_actual} → <b>${c.total_nuevo}</b></p>
    ${lista('Nuevos',c.nuevos.map(x=>x.nombre))}${lista('Se quitan',c.quitados.map(x=>x.nombre+(x.vigente_hasta?` (hasta ${x.vigente_hasta})`:'')))}${lista('Cambian',c.cambiados.map(x=>x.nombre+' ('+x.campos.join(', ')+')'))}
    ${lista('Rutas con cambios',rt.map(x=>x.sucursal+(x.cambia_estado?`: ${x.de} → ${x.a}`:': cambia el texto de afectación')))}
    ${(!c.nuevos.length&&!c.quitados.length&&!c.cambiados.length&&!rt.length)?'<div class="sub">Sin diferencias con lo publicado (solo cambia la fecha de corte).</div>':''}`;
  $('#dlg-ok').disabled=false;
};
$('#dlg-ok').onclick=async()=>{
  $('#dlg-ok').disabled=true; $('#dlg-rev').disabled=true;
  const {status,d}=await enviar('aplicar');
  if(status!==200){ $('#dlg-res').innerHTML=`<div class="err"><b>${esc(d.error||'Error '+status)}</b>${d.detalles?`<ul>${d.detalles.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`; $('#dlg-rev').disabled=false; return; }
  $('#dlg-pin').value=''; dlg.close();
  await cargarDatos(); S.sel=null; dibujarMapa(); render();
  avisar(`Cierres actualizados (corte: ${d.corte}).`, true);
};

// ---------- arranque ----------
(async function init(){
  if(!(await cargarDatos())){ $('#cuerpo').innerHTML='<div class="vacio">No se pudieron cargar los datos.</div>'; return; }

  try{ const st=await getJSON('/api/estado'); S.trafico=!!st.trafico; }catch{ S.trafico=false; }
  if(S.trafico){ aplicarCapaTrafico(); refrescarTrafico(); setInterval(()=>{ if(!document.hidden) refrescarTrafico(); },300000); }
  else avisar('Tráfico en vivo desactivado (sin llave configurada o sin servidor). Se muestran los tiempos estimados fijos.', false);

  if(leyendaEl) leyendaEl.innerHTML=htmlLeyenda();
  dibujarMapa(); ajustarVista(); render();
})();
})();
</script>
</body>
</html>
