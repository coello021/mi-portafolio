<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1620">
<title>Red de Sucursales Vidrí — Mapa en vivo</title>
<meta name="description" content="Mejor ruta en vivo desde CD Nejapa a cada sucursal, con tráfico por tramo y cierres viales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  color-scheme:dark;
  --noche:#0a1620; --panel:rgba(12,26,37,.86); --hund:rgba(255,255,255,.045); --linea:rgba(170,205,225,.14);
  --fg:#e7eff4; --muted:#8fa5b3; --acento:#7fe3d4;
  /* estado de la ruta según cierres */
  --libre:#48d9a4; --prec:#f6b93b; --afect:#ff5a6e;
  /* tráfico por tramo (TomTom) */
  --fluido:#3fd6c0; --leve:#f6c445; --mod:#ff9340; --fuerte:#ff5a4f; --cierre:#e8408f;
  --disp:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--noche);color:var(--fg);font:14px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
#mapa{position:absolute;inset:0;background:var(--noche)}

/* mapa nocturno: las teselas claras de OpenStreetMap se oscurecen y se apagan para que la ruta sea lo que brilla */
.leaflet-base-pane{filter:invert(1) hue-rotate(188deg) brightness(.82) contrast(.82) saturate(.45)}
.leaflet-container{background:var(--noche);font:inherit}
.leaflet-control-attribution{background:rgba(10,22,32,.7)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-color:var(--linea);backdrop-filter:blur(10px)}
.leaflet-bar a:hover{background:#17303f;color:#fff}
.leaflet-tooltip{background:#0f2231;color:var(--fg);border:1px solid var(--linea);box-shadow:0 4px 14px rgba(0,0,0,.4);font:12.5px "Instrument Sans",sans-serif}
.leaflet-tooltip-top:before{border-top-color:#0f2231}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0f2231;color:var(--fg);border:1px solid var(--linea)}
.leaflet-popup-content{font:13px/1.45 "Instrument Sans",sans-serif;margin:12px 14px}
.leaflet-popup-content b{font-family:var(--disp);font-size:15px}
.leaflet-popup-close-button{color:var(--muted)!important}

/* panel flotante */
#side{position:absolute;z-index:1000;left:14px;top:14px;bottom:14px;width:min(404px,calc(100vw - 28px));
  background:var(--panel);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--linea);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;min-height:0;overflow:hidden}
header{padding:16px 18px 10px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px}
header h1{font-size:23px;line-height:1.1;grid-column:1/-1}
header p{margin:0;color:var(--muted);font-size:13px}
.vivo-ind{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.vivo-ind i{width:8px;height:8px;border-radius:50%;background:#58697a}
.vivo-ind.on{color:var(--fg)}
.vivo-ind.on i{background:var(--fluido);box-shadow:0 0 0 0 rgba(63,214,192,.7);animation:latido 2s infinite}
#aviso{margin:0 18px 6px;padding:8px 10px;border-left:3px solid var(--prec);background:rgba(246,185,59,.1);border-radius:4px;font-size:12.5px;display:none}
#aviso.ok{border-color:var(--libre);background:rgba(72,217,164,.1)}
#sello{margin:0 18px 6px;font-size:12px;color:var(--muted)}
#sello.viejo{color:var(--fg);border-left:3px solid var(--prec);background:rgba(246,185,59,.1);padding:6px 9px;font-size:12.5px;border-radius:4px}
.tabs{display:flex;margin:4px 18px 0;padding:3px;background:var(--hund);border-radius:10px;gap:2px}
.tab{flex:1;border:0;background:transparent;padding:6px 10px;border-radius:8px;font-weight:500;color:var(--muted)}
.tab[aria-selected=true]{background:#1b3646;color:var(--fg)}
.cuerpo{flex:1;overflow:auto;padding:12px 18px 18px;min-height:0;scrollbar-width:thin;scrollbar-color:#2c4658 transparent}
#asa{display:none}

input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--hund);color:var(--fg);font:inherit}
input[type=search]::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{border:1px solid var(--linea);background:transparent;border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--muted)}
.chip:hover{color:var(--fg)}
.chip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--noche);font-weight:500}
.capas{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.tg{position:relative;display:inline-flex}
.tg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;z-index:1;width:100%;height:100%}
.tg span{border:1px solid var(--linea);border-radius:999px;padding:3px 11px 3px 24px;font-size:12.5px;color:var(--muted);position:relative}
.tg span:before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;border:1.5px solid #5d7585}
.tg input:checked+span{color:var(--fg);border-color:#3f6a7c;background:rgba(127,227,212,.08)}
.tg input:checked+span:before{background:var(--acento);border-color:var(--acento)}
.tg input:focus-visible+span{outline:2px solid var(--acento);outline-offset:2px}
.tg.off{opacity:.4}
.cuenta{color:var(--muted);font-size:12.5px;margin:10px 0 2px}

.item{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--linea);padding:10px 4px;border-radius:0}
.item:hover,.item.hov{background:var(--hund)}
.punto{width:10px;height:10px;border-radius:50%;flex:none}
.item b{display:block;font-weight:500}
.item small{color:var(--muted)}
.item .t{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .t small{display:block}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:500;color:#0a1620}
.vacio{color:var(--muted);padding:16px 0}
.sub{color:var(--muted);font-size:12.5px}

/* detalle */
.atras{border:0;background:transparent;color:var(--acento);padding:0;margin-bottom:10px;font-weight:500}
.det h2{font-size:27px;line-height:1.1}
.det .meta{color:var(--muted);margin:5px 0 0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.hero{margin:14px 0 4px;padding:14px 16px;border-radius:14px;background:linear-gradient(160deg,rgba(63,214,192,.14),rgba(63,214,192,.03));border:1px solid rgba(63,214,192,.28);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.hero.prec{background:linear-gradient(160deg,rgba(255,147,64,.16),rgba(255,147,64,.03));border-color:rgba(255,147,64,.35)}
.hero.afect{background:linear-gradient(160deg,rgba(255,90,79,.18),rgba(255,90,79,.03));border-color:rgba(255,90,79,.4)}
.hero.fijo{background:var(--hund);border-color:var(--linea)}
.tiempo{font-family:var(--disp);font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiempo .num{font-size:60px;letter-spacing:-.03em}
.tiempo .uni{font-size:17px;font-weight:500;color:var(--muted);margin:0 6px 0 4px;letter-spacing:0}
.hero-d{padding-bottom:4px;min-width:0}
.hero-d b{display:block;font-size:15px}
.hero-d span{color:var(--muted);font-size:12.5px;display:block;line-height:1.35}
.cargando .num{color:transparent;background:linear-gradient(90deg,#1b3646 25%,#2a4b5f 50%,#1b3646 75%);background-size:200% 100%;border-radius:8px;animation:brillo 1.2s linear infinite}
.nota{color:var(--muted);font-size:12px;margin:8px 0 0;line-height:1.45}
.coin{font-size:12.5px;margin:8px 0 0;color:var(--muted)}
.coin b{color:var(--fg);font-weight:500}
.sec{margin:16px 0 0}
.sec h3{font-size:15px;margin-bottom:6px}
.opciones{display:grid;gap:6px}
.op{display:grid;grid-template-columns:1fr auto;gap:0 10px;text-align:left;border:1px solid var(--linea);background:transparent;border-radius:10px;padding:8px 12px;position:relative}
.op:hover{background:var(--hund)}
.op[aria-pressed=true]{border-color:var(--acento);background:rgba(127,227,212,.07)}
.op b{font-weight:500}
.op small{color:var(--muted);grid-column:1}
.op .d{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-family:var(--disp);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.op .d small{display:block;font-family:"Instrument Sans",system-ui,sans-serif;font-weight:400;font-size:12px}
.tramos{list-style:none;margin:0;padding:0}
.tramos li{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--linea);cursor:pointer}
.tramos li:hover{background:var(--hund)}
.tramos .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.tramos b{font-weight:500;display:block}
.okline{color:var(--fluido);margin:0;font-weight:500}
.via{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0}
.via span{font-size:12px;background:var(--hund);border:1px solid var(--linea);border-radius:6px;padding:1px 7px}
.alerta{border-left:4px solid var(--afect);background:rgba(255,90,110,.1);border-radius:6px;padding:9px 11px;margin:12px 0 0}
.alerta.prec{border-color:var(--prec);background:rgba(246,185,59,.1)}
.alerta b{display:block}
.dato{font-size:13px;margin:3px 0;color:var(--muted)}
.dato a{color:inherit}
details.pasos-d{border:1px solid var(--linea);border-radius:10px;margin:14px 0 0}
details.pasos-d summary{cursor:pointer;padding:9px 12px;font-weight:500}
ol.pasos{margin:0;padding:0 12px 8px;list-style:none}
ol.pasos li{padding:6px 0;border-bottom:1px dashed var(--linea);cursor:pointer}
ol.pasos li:hover{background:var(--hund)}
ol.pasos .al{color:var(--afect);font-size:12.5px}
.caja{border:1px solid var(--linea);border-radius:12px;padding:11px 13px;margin:10px 0;background:var(--hund);cursor:pointer}
.caja h3{font-size:16px;margin-bottom:4px}
.caja.venc{opacity:.65}
.btn-sec{border:1px solid var(--linea);background:var(--hund);border-radius:10px;padding:8px 12px;font-weight:500;margin-bottom:10px;width:100%}
.btn-sec:hover{border-color:#3f6a7c}

/* marcadores */
.cd-nodo{position:relative;width:26px;height:26px}
.cd-nodo .rombo{position:absolute;left:5px;top:5px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px;box-shadow:0 0 0 3px var(--cierre),0 2px 10px rgba(0,0,0,.6)}
.cd-nodo .aro{position:absolute;inset:0;border-radius:50%;border:2px solid var(--cierre);animation:aro 2.6s ease-out infinite}
.destino{position:relative;width:34px;height:34px}
.destino i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c,#fff);animation:aro 1.8s ease-out infinite}
.destino i+i{animation-delay:.9s}
.fluye{animation:fluye 1.1s linear infinite}

.leyenda{background:var(--panel);backdrop-filter:blur(12px);color:var(--fg);border:1px solid var(--linea);border-radius:12px;font-size:12px;line-height:1.7;max-width:240px}
.leyenda summary{cursor:pointer;padding:7px 12px;font-weight:500;list-style:none}
.leyenda summary::-webkit-details-marker{display:none}
.leyenda[open] summary{border-bottom:1px solid var(--linea)}
.leyenda .lg-b{padding:7px 12px 9px}
.leyenda i.l{display:inline-block;width:22px;height:4px;border-radius:2px;margin-right:7px;vertical-align:middle}
.leyenda hr{border:0;border-top:1px solid var(--linea);margin:6px 0}
.leyenda .lg{display:inline-block;vertical-align:middle;flex:none}
.leyenda .lg-cd{width:9px;height:9px;background:#fff;transform:rotate(45deg);box-shadow:0 0 0 2px var(--cierre);margin:0 10px 0 7px}
.leyenda .lg-suc{width:11px;height:11px;border-radius:50%;background:#8da2b0;border:2px solid #0a1620;box-shadow:0 0 0 1px #8da2b0;margin:0 8px 0 5px}
.leyenda .lg-cie{width:18px;height:18px;border-radius:50%;border:2px solid var(--afect);background:rgba(255,90,110,.22);margin-right:5px}
.leyenda .lg-venc{border-style:dashed;opacity:.65}
.leyenda .lg-inc{width:11px;height:11px;border-radius:50%;border:2px solid #fff;margin:0 8px 0 6px;box-sizing:content-box}
.leyenda .lg-traf{width:100%;height:6px;border-radius:3px;margin:3px 0 0;background:linear-gradient(90deg,var(--fluido),var(--leve),var(--mod),var(--fuerte),var(--cierre))}
.leyenda .esc{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;line-height:1.2}

dialog{border:1px solid var(--linea);border-radius:16px;background:#0f2231;color:var(--fg);padding:18px 20px;width:min(560px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(2,8,14,.7)}
dialog label{display:block;margin:12px 0 3px;font-weight:500}
dialog input{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--hund);color:var(--fg);font:inherit}
.dlg-acc{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.dlg-acc button{border:1px solid var(--linea);background:transparent;border-radius:8px;padding:7px 14px}
.dlg-acc button.pri{background:var(--acento);border-color:var(--acento);color:#0a1620;font-weight:600}
.dlg-acc button:disabled{opacity:.35;cursor:not-allowed}
.err{border-left:4px solid var(--afect);background:rgba(255,90,110,.1);padding:8px 10px;margin:10px 0;border-radius:6px}
.adv{border-left:4px solid var(--prec);background:rgba(246,185,59,.1);padding:8px 10px;margin:8px 0;border-radius:6px}
.res ul{margin:4px 0 8px;padding-left:18px}

@keyframes fluye{to{stroke-dashoffset:-13}}
@keyframes aro{0%{transform:scale(.45);opacity:.95}100%{transform:scale(1.5);opacity:0}}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(63,214,192,.6)}70%{box-shadow:0 0 0 7px rgba(63,214,192,0)}100%{box-shadow:0 0 0 0 rgba(63,214,192,0)}}
@keyframes brillo{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){
  .fluye,.destino i,.cd-nodo .aro,.vivo-ind.on i,.cargando .num{animation:none}
  .destino i{opacity:.6}
}
@media (max-width:820px){
  #side{left:0;right:0;bottom:0;top:auto;width:auto;height:56vh;height:56dvh;border-radius:18px 18px 0 0;border-width:1px 0 0;transition:height .25s ease}
  #side.abajo{height:112px}
  #asa{display:block;position:absolute;left:50%;top:5px;transform:translateX(-50%);width:54px;height:16px;border:0;background:transparent;padding:0;z-index:2}
  #asa:before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:#4a6577;margin:6px auto}
  header{padding-top:20px}
  header h1{font-size:20px}
  .tiempo .num{font-size:52px}
}
</style>
</head>
<body>
<main id="mapa" aria-label="Mapa de rutas"></main>
<aside id="side">
  <button id="asa" aria-label="Subir o bajar el panel"></button>
  <header>
    <h1>Red de sucursales Vidrí</h1>
    <p>Mejor ruta desde CD Nejapa</p>
    <div class="vivo-ind" id="vivo-ind" title="Estado de la conexión con TomTom"><i></i><span>Sin conexión</span></div>
  </header>
  <div id="aviso" role="status"></div>
  <div id="sello"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-suc" aria-selected="true">Sucursales</button>
    <button class="tab" role="tab" id="tab-cie" aria-selected="false">Cierres</button>
  </div>
  <div class="cuerpo" id="cuerpo"></div>
</aside>

<dialog id="dlg" aria-labelledby="dlg-t">
  <h2 id="dlg-t" style="font-size:21px">Actualizar cierres</h2>
  <p class="sub">Sube el reporte JSON. Solo se acepta si es más nuevo que lo publicado; nunca retrocede.</p>
  <label for="dlg-pin">PIN</label><input type="password" id="dlg-pin" autocomplete="off">
  <label for="dlg-file">Archivo del reporte (.json)</label><input type="file" id="dlg-file" accept=".json,application/json">
  <div id="dlg-res" class="res" aria-live="polite"></div>
  <div class="dlg-acc"><button id="dlg-cancel" type="button">Cancelar</button><button id="dlg-rev" type="button" disabled>Revisar</button><button id="dlg-ok" type="button" class="pri" disabled>Aplicar cambios</button></div>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';
const COLOR = {'Libre':'#48d9a4','Precaución':'#f6b93b','Afectada':'#ff5a6e'};
const MAG = ['#f6c445','#f6c445','#ff9340','#ff5a4f','#e8408f'];            // 0 sin clasificar, 1 leve, 2 moderado, 3 fuerte, 4 cierre
const MAG_TXT = ['sin clasificar','leve','moderado','fuerte','cierre o demora indefinida'];
const CAT_TXT = {JAM:'Tráfico lento',ROAD_WORK:'Obras',ROAD_CLOSURE:'Cierre de vía',OTHER:'Incidente'};
const FLUIDO = '#3fd6c0';
// incidentes reportados por TomTom (iconCategory)
const INC_TXT = {0:'Incidente',1:'Accidente',2:'Niebla',3:'Condiciones peligrosas',4:'Lluvia',5:'Hielo',6:'Tráfico lento',7:'Carril cerrado',8:'Vía cerrada',9:'Obras',10:'Viento fuerte',11:'Inundación',14:'Vehículo averiado'};
const INC_COL = {1:'#ff5a4f',7:'#e8408f',8:'#e8408f',9:'#f6c445',6:'#ff9340',14:'#ff9340',2:'#6cb2ff',3:'#6cb2ff',4:'#6cb2ff',5:'#6cb2ff',10:'#6cb2ff',11:'#6cb2ff',0:'#9fb4c2'};
const INC_ORDEN = {8:0,7:1,1:2,11:3,3:4,9:5,14:6,6:7}; // lo más grave primero
const incCol = (c)=> INC_COL[c] || INC_COL[0];
const incTxt = (c)=> INC_TXT[c] || INC_TXT[0];
const $ = (s)=>document.querySelector(s);
const esc = (t)=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = (t)=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const HOY = new Date().toISOString().slice(0,10);
const MOVIL = ()=>window.matchMedia('(max-width:820px)').matches;

const S = { suc:[], cd:null, rutas:new Map(), cierres:[], sel:null, zona:'Todas', estado:'Todos', q:'',
  trafico:false, tab:'suc',
  vivo:new Map(), alt:0, vEstado:'off', inc:null, incT:0 };   // inc: null = sin cargar, 'fallo', o lista

// ---------- utilidades ----------
function decodePoly(str){
  let i=0,lat=0,lon=0,out=[];
  while(i<str.length){
    let b,sh=0,r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);
    lat+=(r&1)?~(r>>1):(r>>1);
    sh=0;r=0;
    do{b=str.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5}while(b>=32);
    lon+=(r&1)?~(r>>1):(r>>1);
    out.push([lat/1e5,lon/1e5]);
  }
  return out;
}
const fmtMin = (m)=> m>=60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`;
const fmtM = (m)=> m>=1000 ? `${(m/1000).toFixed(1)} km` : `${m} m`;
const hora = (d)=> d.toLocaleTimeString('es-SV',{hour:'numeric',minute:'2-digit'});
function vigencia(c){
  if(!c.vigente_hasta) return {txt:'Sin fecha de fin publicada', vencido:false};
  const v = c.vigente_hasta < HOY;
  return {txt: (v?'Venció el ':'Vigente hasta el ')+c.vigente_hasta, vencido:v};
}
// Si el servidor responde con error, el mensaje de la función (p. ej. "TomTom respondió 403") llega en e.message
async function getJSON(u, ms){
  const c=new AbortController(), t=setTimeout(()=>c.abort(), ms||15000);
  try{
    const r=await fetch(u,{signal:c.signal});
    if(!r.ok){ let m=''; try{ m=(await r.json()).error||''; }catch{} const e=new Error(m||('error '+r.status)); e.status=r.status; throw e; }
    return await r.json();

function hav(a,b){ const R=6371000,t=x=>x*Math.PI/180,dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);
  const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function largo(p){ let t=0; for(let i=1;i<p.length;i++) t+=hav(p[i-1],p[i]); return t; }
// % de la ruta A que queda a menos de 150 m de la ruta de referencia (para saber si TomTom sigue la ruta habitual)
function coincide(A, R){
  if(!R||R.length<2||!A||A.length<2) return null;
  const lat0=R[0][0], kx=111320*Math.cos(lat0*Math.PI/180), ky=110540;
  const m=p=>[p[1]*kx,p[0]*ky], RR=R.map(m), AA=A.map(m);
  const paso=Math.max(1,Math.floor(AA.length/200)); let ok=0,n=0;
  for(let i=0;i<AA.length;i+=paso){
    n++; let best=1e9; const [px,py]=AA[i];
    for(let j=0;j<RR.length-1&&best>150;j++){
      const [ax,ay]=RR[j],[bx,by]=RR[j+1],dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;
      let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=Math.max(0,Math.min(1,t));
      const d=Math.hypot(ax+t*dx-px,ay+t*dy-py); if(d<best) best=d;
    }
    if(best<=150) ok++;
  }
  return Math.round(100*ok/n);
}
// Incidentes de TomTom que quedan a menos de 200 m de la ruta elegida
function metrosRuta(ru){
  if(ru._m) return ru._m;
  const p=puntos(ru), lat0=p[0][0], kx=111320*Math.cos(lat0*Math.PI/180), ky=110540;
  return ru._m={kx,ky,R:p.map(q=>[q[1]*kx,q[0]*ky])};
}
function distARuta(pt, m){
  const px=pt[1]*m.kx, py=pt[0]*m.ky, R=m.R; let best=1e9;
  for(let j=0;j<R.length-1;j++){
    const ax=R[j][0],ay=R[j][1],dx=R[j+1][0]-ax,dy=R[j+1][1]-ay;
    const x1=Math.min(ax,R[j+1][0]), x2=Math.max(ax,R[j+1][0]);
    if(px<x1-2500||px>x2+2500) continue;      // lejos: no hace falta calcular
    const l=dx*dx+dy*dy; let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(ax+t*dx-px,ay+t*dy-py); if(d<best) best=d;
  }
  return best;
}
function incidentesDeRuta(ru){
  if(!Array.isArray(S.inc)) return [];
  if(ru._inc && ru._incT===S.incT) return ru._inc;
  const m=metrosRuta(ru);
  const l=S.inc.filter(i=>i.geo.some(g=>distARuta(g,m)<=200))
    .sort((a,b)=>(INC_ORDEN[a.cat]??9)-(INC_ORDEN[b.cat]??9)||b.mag-a.mag);
  ru._incT=S.incT; return ru._inc=l;
}

function incTitulo(i){

function renderDetalle(){

  const sinAf=!af||/^sin cierres/i.test(af);
  const bloqueAf = sinAf
    ? `<div class="sec"><p class="okline">${esc(af||'Sin cierres viales reportados en la ruta')}</p>${r.recomendacion?`<div class="sub">${esc(r.recomendacion)}</div>`:''}</div>`
    : `<div class="alerta ${r.estado==='Precaución'?'prec':''}"><b>${esc(r.estado==='Afectada'?'Ruta afectada por cierres':'Precaución en la ruta')}</b>${esc(af)}${r.recomendacion?`<div style="margin-top:4px"><b style="display:inline">Qué hacer:</b> ${esc(r.recomendacion)}</div>`:''}</div>`;
  $('#cuerpo').innerHTML=`<div class="det">
    <button class="atras" id="atras">← Todas las sucursales</button>
    <h2>${esc(s.sucursal)}</h2>
    <div class="meta"><span class="pill" style="background:${COLOR[r.estado]}">${esc(r.estado)}</span><span>${esc(s.tipo)} ${esc(s.codigo)}, ${esc(s.municipio)}</span></div>
    <div id="vivo"></div>
    ${bloqueAf}
    ${via.length?`<div class="sec"><h3>Ruta habitual</h3><div class="via" aria-label="Vías">${via.map(v=>`<span>${esc(v)}</span>`).join('')}</div></div>`:''}
    <details class="pasos-d"><summary>Indicaciones de la ruta habitual (${pasos.length})</summary>
      <ol class="pasos">${pasos.map((p,i)=>`<li data-i="${i}"><b>${esc(p[0])}</b>${p[1]?`: ${esc(p[1])}`:''} <span class="sub">${fmtM(p[2])}</span>${p[5]?`<div class="al">${esc(p[5])}</div>`:''}</li>`).join('')}</ol>
    </details>
    <div class="sec"><div class="dato">${esc(s.direccion)}</div>
    ${s.telefono?`<div class="dato"><a href="tel:${esc(s.telefono)}">${esc(s.telefono)}</a></div>`:''}
    <div class="dato">${esc(s.horario_semana)}. Domingo ${esc(s.horario_domingo)}</div></div>
  </div>`;
  $('#atras').onclick=()=>seleccionar(null);
  document.querySelectorAll('ol.pasos li').forEach(li=>li.onclick=()=>{const p=pasos[li.dataset.i]; map.flyTo([p[4],p[3]],16,{duration:.8});});
  pintarVivo();
}

// ---------- ruta en vivo ----------
async function cargarRuta(cod, silencioso){
  if(!S.trafico){ S.vEstado='off'; pintarVivo(); return; }
  const hit=S.vivo.get(cod);
  if(hit && Date.now()-hit.t<300000){ if(silencioso) return; S.vEstado='ok'; S.alt=0; dibujarMapa(); pintarVivo(); enfocarVivo(); return; }
  if(!silencioso){ S.vEstado='carga'; pintarVivo(); }
  let d=null;
  try{ d=await getJSON('/api/ruta?codigo='+encodeURIComponent(cod)); if(!d.rutas||!d.rutas.length) throw new Error('respuesta sin ruta'); S.vivo.set(cod,{t:Date.now(),d}); }
  catch(e){ d=null; S.vMotivo = e.name==='AbortError' ? 'tardó demasiado en responder' : (e.message||'error'); }
  if(S.sel!==cod) return;
  if(!d){ if(!vivoActual()){ S.vEstado='fallo'; pintarVivo(); dibujarMapa(); } return; }
  const habia=!!hit; S.vEstado='ok'; S.alt=Math.min(S.alt,d.rutas.length-1);
  dibujarMapa(); pintarVivo(); if(!habia) enfocarVivo();
}
async function cargarIncidentes(){
  try{
    const d=await getJSON('/api/incidentes');
    if(!Array.isArray(d.incidentes)) throw 0;
    S.inc=d.incidentes; S.incPar=!!d.parcial; S.incT=Date.now();
  }catch{ if(!Array.isArray(S.inc)) S.inc='fallo'; }   // si ya había una lista, se conserva la anterior
  if(S.sel && vivoActual()){ dibujarVivo(); pintarVivo(); }
}
function enfocarVivo(){ const d=vivoActual(); if(d) fit(L.latLngBounds(puntos(d.rutas[S.alt])),{maxZoom:15}); }
function elegirAlt(i){ S.alt=i; dibujarVivo(); pintarVivo(); enfocarVivo(); }

// ---------- interacción ----------
function seleccionar(cod){
  S.sel=cod; S.alt=0; S.vEstado=cod&&S.trafico?'carga':'off';
  dibujarMapa();
  if(cod){
    const l=refs.lineas.get(cod);
    if(l) fit(l.getBounds()); else { const s=S.suc.find(x=>x.codigo===cod); map.flyTo([s.lat,s.lon],14); }
  } else ajustarVista();
  render();
  $('#cuerpo').scrollTop=0;
  if(cod){ cargarRuta(cod); if(MOVIL()) $('#side').classList.remove('abajo'); }
}
$('#tab-suc').onclick=()=>{S.tab='suc';S.sel=null;dibujarMapa();render();};
$('#tab-cie').onclick=()=>{S.tab='cie';S.sel=null;dibujarMapa();render();};
$('#asa').onclick=()=>$('#side').classList.toggle('abajo');
$('#cuerpo').addEventListener('click',e=>{
  if(e.target.closest('#btn-actualizar')) return abrirDlg();
  const z=e.target.closest('[data-zona]'), it=e.target.closest('[data-cod]'), ci=e.target.closest('[data-cie]'),
        al=e.target.closest('[data-alt]'), tr=e.target.closest('[data-t]'), ic=e.target.closest('[data-inc]');
  if(z){S.zona=z.dataset.zona;dibujarMapa();ajustarVista();render();}
  else if(it) seleccionar(it.dataset.cod);
  else if(al) elegirAlt(+al.dataset.alt);
  else if(tr){ const d=vivoActual(); if(d){ const ru=d.rutas[S.alt], t=ru.tramos[+tr.dataset.t]; fit(L.latLngBounds(puntos(ru).slice(t.a,t.b+1)),{maxZoom:16}); } }
  else if(ic){ const d=vivoActual(); if(d){ const i=incidentesDeRuta(d.rutas[S.alt])[+ic.dataset.inc]; if(i) fit(L.latLngBounds(i.geo),{maxZoom:16}); } }
  else if(ci){const c=S.cierres.find(x=>x.id===ci.dataset.cie);map.flyTo([c.lat,c.lon],15,{duration:.8});
    L.popup().setLatLng([c.lat,c.lon]).setContent(popupCierre(c)).openOn(map);}
});
// al pasar sobre una sucursal de la lista se enciende su ruta en el mapa
function resaltar(cod,on){
  const l=refs.lineas.get(cod); if(!l||S.sel) return;
  l.setStyle(on?{opacity:.95,weight:5}:{opacity:.42,weight:2.5}); if(on) l.bringToFront();
}
$('#cuerpo').addEventListener('mouseover',e=>{ const it=e.target.closest('[data-cod]'); if(it) resaltar(it.dataset.cod,true); });
$('#cuerpo').addEventListener('mouseout',e=>{ const it=e.target.closest('[data-cod]'); if(it) resaltar(it.dataset.cod,false); });

// ---------- datos ----------
async function cargarDatos(){
  try{
    const [suc,rutas,cierres,meta]=await Promise.all([getJSON('data/sucursales.json'),getJSON('data/rutas.json'),getJSON('data/cierres.json'),getJSON('data/meta.json').catch(()=>null)]);
    S.cd=suc.find(s=>s.codigo==='CD'); S.suc=suc.filter(s=>s.codigo!=='CD');
    S.rutas.clear(); rutas.forEach(r=>S.rutas.set(String(r.codigo),r)); S.cierres=cierres; S.meta=meta;
  }catch(e){ return false; }
  try{ // último reporte subido (si existe) sobre los datos base
    const a=await getJSON('/api/cierres');
    if(a && a.origen==='subido'){
      S.cierres=a.cierres;
      for(const [cod,o] of Object.entries(a.rutas||{})){ const r=S.rutas.get(cod); if(r) Object.assign(r,o); }
      S.meta={corte:a.corte,corte_iso:a.corte_iso,subido:a.subido,origen:'subido'};
    }
  }catch(e){}
  pintarSello();
  return true;
}
function pintarSello(){
  const m=S.meta, el=$('#sello'); if(!m||!m.corte_iso){ el.textContent=''; return; }
  const c=new Date(m.corte_iso), h=(Date.now()-c)/36e5;
  const f=c.toLocaleString('es-SV',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  if(h>48){ el.className='viejo'; el.textContent=`Cierres sin actualizar desde hace ${Math.floor(h/24)} días (corte: ${f}). Confirma antes de despachar.`; }
  else { el.className=''; el.textContent=`Cierres y rutas: corte del ${f}${m.origen==='subido'?'':' (datos base)'}`; }
}

// ---------- subir reporte ----------
let reporte=null;
const dlg=$('#dlg');
function abrirDlg(){ reporte=null; $('#dlg-res').innerHTML=''; $('#dlg-file').value=''; $('#dlg-rev').disabled=true; $('#dlg-ok').disabled=true; dlg.showModal(); }
$('#dlg-cancel').onclick=()=>{ $('#dlg-pin').value=''; dlg.close(); };
$('#dlg-file').onchange=async e=>{
  reporte=null; $('#dlg-ok').disabled=true; $('#dlg-rev').disabled=true;
  const f=e.target.files[0]; if(!f) return;
  try{ reporte=JSON.parse(await f.text()); $('#dlg-rev').disabled=false; $('#dlg-res').innerHTML=`<div class="sub">Archivo listo: ${esc(f.name)}. Pulsa “Revisar”.</div>`; }
  catch{ $('#dlg-res').innerHTML='<div class="err">El archivo no es un JSON válido.</div>'; }
};
async function enviar(modo){
  const r=await fetch('/api/cierres/subir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('#dlg-pin').value,reporte,modo})});
  let d={}; try{ d=await r.json(); }catch{} return {status:r.status,d};
}
const lista=(t,a)=>a.length?`<b>${t}</b><ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
$('#dlg-rev').onclick=async()=>{
  $('#dlg-ok').disabled=true; $('#dlg-res').innerHTML='<div class="sub">Revisando…</div>';
  let r; try{ r=await enviar('previa'); }catch{ $('#dlg-res').innerHTML='<div class="err">No se pudo contactar al servidor.</div>'; return; }
  const {status,d}=r;
  if(status!==200){ $('#dlg-res').innerHTML=`<div class="err"><b>${esc(d.error||'Error '+status)}</b>${d.detalles?`<ul>${d.detalles.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`; return; }
  const c=d.diferencias.cierres, rt=d.diferencias.rutas;
  $('#dlg-res').innerHTML=`<div><b>Corte nuevo:</b> ${esc(d.corte_nuevo)}<br><b>Corte publicado:</b> ${esc(d.corte_actual)}</div>
    ${d.diferencias.advertencias.map(a=>`<div class="adv">${esc(a)}</div>`).join('')}
    <p>Cierres: ${c.total_actual} → <b>${c.total_nuevo}</b></p>
    ${lista('Nuevos',c.nuevos.map(x=>x.nombre))}${lista('Se quitan',c.quitados.map(x=>x.nombre+(x.vigente_hasta?` (hasta ${x.vigente_hasta})`:'')))}${lista('Cambian',c.cambiados.map(x=>x.nombre+' ('+x.campos.join(', ')+')'))}
    ${lista('Rutas con cambios',rt.map(x=>x.sucursal+(x.cambia_estado?`: ${x.de} → ${x.a}`:': cambia el texto de afectación')))}
    ${(!c.nuevos.length&&!c.quitados.length&&!c.cambiados.length&&!rt.length)?'<div class="sub">Sin diferencias con lo publicado (solo cambia la fecha de corte).</div>':''}`;
  $('#dlg-ok').disabled=false;
};
$('#dlg-ok').onclick=async()=>{
  $('#dlg-ok').disabled=true; $('#dlg-rev').disabled=true;
  const {status,d}=await enviar('aplicar');
  if(status!==200){ $('#dlg-res').innerHTML=`<div class="err"><b>${esc(d.error||'Error '+status)}</b>${d.detalles?`<ul>${d.detalles.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>`; $('#dlg-rev').disabled=false; return; }
  $('#dlg-pin').value=''; dlg.close();
  await cargarDatos(); S.sel=null; dibujarMapa(); render();
  avisar(`Cierres actualizados (corte: ${d.corte}).`, true);
};

// ---------- arranque ----------
(async function init(){
  if(!(await cargarDatos())){ $('#cuerpo').innerHTML='<div class="vacio">No se pudieron cargar los datos.</div>'; return; }

  try{ const st=await getJSON('/api/estado'); S.trafico=!!st.trafico; }catch{ S.trafico=false; }
  indicador();
  if(S.trafico){
    // cada 5 min: se actualizan los incidentes y, si hay una sucursal abierta, se recalcula su ruta
    cargarIncidentes();
    setInterval(()=>{ if(document.hidden) return; cargarIncidentes(); if(S.sel) cargarRuta(S.sel,true); },300000);
  } else avisar('Tráfico en vivo desactivado (sin llave configurada o sin servidor). Se muestran los tiempos estimados fijos.', false);

  if(leyendaEl) leyendaEl.innerHTML=htmlLeyenda();
  dibujarMapa(); ajustarVista(); render();
})();
})();
</script>
