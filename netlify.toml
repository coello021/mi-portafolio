# Sitio estático + funciones. Esto anula la configuración de Astro del sitio anterior.
[build]
  publish = "public"
  command = "echo 'sin build'"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Pide a los buscadores no indexar nada (no es protección de acceso: quien tenga el enlace puede abrirlo).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
